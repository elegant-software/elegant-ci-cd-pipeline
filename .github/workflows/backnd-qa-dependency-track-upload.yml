name: CI · Dependency-Track SBOM Upload

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to run on (single label)
        required: false
        type: string
        default: self-hosted

jobs:
  sbom-upload:
    name: Upload SBOM to Dependency-Track
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Show runner
        run: echo "Runner ${{ runner.name }} (${{ runner.environment }}, ${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate SBOM
        run: ./gradlew generateSbom

      - name: Upload SBOM to Dependency-Track
        run: ./gradlew uploadSbom
        env:
          DT_URL: http://myserver:8181
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
  watchdog:
    name: Watchdog
    uses: ./.github/workflows/general-util-watchdog.yml
    with:
      runner: ${{ inputs.runner }}
    permissions:
      actions: write
