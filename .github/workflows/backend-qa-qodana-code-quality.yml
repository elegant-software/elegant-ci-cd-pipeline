#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: CI · Qodana Code Quality
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to run on (single label)
        required: false
        type: string
        default: self-hosted

jobs:
  qodana:
    name: Qodana scan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Show runner
        run: echo "Runner ${{ runner.name }} (${{ runner.environment }}, ${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2.0
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          DOCKER_HOST: ssh://myserver
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'
  watchdog:
    name: Watchdog
    uses: ./.github/workflows/general-util-watchdog.yml
    with:
         wait-minutes: 15
         runner: ${{ inputs.runner }}
    permissions:
      actions: write
