name: Util · Watchdog

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to run on (single label)
        required: false
        type: string
        default: ubuntu-latest
      wait-minutes:
        description: 'Minutes to wait before cancelling the workflow run'
        type: number
        default: 5
        required: false

jobs:
  watchdog:
    name: Cancel run after ${{ inputs.wait-minutes }}m
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
    steps:
      - name: Show runner
        run: echo "Runner ${{ runner.name }} (${{ runner.environment }}, ${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait ${{ inputs.wait-minutes }} minute(s)
        run: sleep $(( ${{ inputs.wait-minutes }} * 60 ))

      - name: Cancel workflow if self-hosted job did not start
        uses: actions/github-script@v8
        with:
          script: |
            const run_id = process.env.GITHUB_RUN_ID;
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id
            });
